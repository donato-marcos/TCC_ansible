---

- name: Instalar pacotes necessários
  ansible.builtin.apt:
    name:
      - bind9
      - bind9-dnsutils
    state: present

- name: Configurar o arquivo /etc/bind/named.conf.options
  ansible.builtin.template:
    src: template_named.conf.options.j2
    dest: /etc/bind/named.conf.options
    owner: root
    group: bind
    mode: '0644'
    backup: true
    validate: "named-checkconf %s"
  notify:
    - Validar configuracao global
    - Reiniciar o serviço BIND9

- name: Configurar o arquivo /etc/bind/named.conf.local
  ansible.builtin.template:
    src: template_named.conf.local.j2
    dest: /etc/bind/named.conf.local
    owner: root
    group: bind
    mode: '0644'
    backup: true
    validate: "named-checkconf %s"
  notify:
    - Validar configuracao global
    - Reiniciar o serviço BIND9

- name: Criar o arquivo de zona direta
  ansible.builtin.template:
    src: template_direct_zone.j2
    dest: "{{ bind_cache_dir }}/{{ zone_name }}.zone"
    owner: root
    group: bind
    mode: '0644'
    backup: true
    validate: "named-checkzone {{ zone_name }} %s"
  notify:
    - Validar configuracao global
    - Reiniciar o serviço BIND9

- name: Criar o arquivo de zona reversa
  ansible.builtin.template:
    src: template_reverse_zone.j2
    dest: "{{ bind_cache_dir }}/{{ zone_name }}.rev"
    owner: root
    group: bind
    mode: '0644'
    backup: true
    validate: "named-checkzone {{ reverse_zone }} %s"
  notify:
    - Validar configuracao global
    - Reiniciar o serviço BIND9

- name: Iniciar o serviço BIND9
  ansible.builtin.service:
    name: bind9.service
    state: started
    enabled: true
