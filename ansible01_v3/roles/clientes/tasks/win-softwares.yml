---

- name: Instalar Chocolatey
  chocolatey.chocolatey.win_chocolatey:
    name: chocolatey
    state: present

- name: Instalar softwares via Chocolatey
  chocolatey.chocolatey.win_chocolatey:
    name: "{{ item }}"
    state: present
  loop: "{{ packages }}"
  loop_control:
    label: "Instalando: {{ item }}"
