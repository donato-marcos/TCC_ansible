---

- name: Configurar interfaces no Rocky Linux 9
  community.general.nmcli:
    conn_name: "{{ item.name }}"
    ifname: "{{ item.name }}"
    type: "{{ item.type | default('ethernet') }}"
    method4: "{{ item.method | default('auto') }}"
    ip4: "{{ item.ipv4 | default(omit) }}"
    gw4: "{{ item.gw4 | default(omit) }}"
    dns4: "{{ item.dns4 | default(omit) }}"
    autoconnect: "{{ item.autoconnect | default(true) }}"
    state: present
  loop: "{{ interfaces }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reiniciar NetworkManager

- name: Forçar execução dos handlers agora
  ansible.builtin.meta: flush_handlers
