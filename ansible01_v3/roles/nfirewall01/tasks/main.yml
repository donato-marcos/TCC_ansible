---
- name: Configurar hostname
  vyos.vyos.vyos_hostname:
    config:
      hostname: "{{ hostname }}"
  notify: Salvar configuração

- name: Configurar banner pre-login
  vyos.vyos.vyos_banner:
    banner: pre-login
    text: "{{ banner.pre_login }}"
    state: present
  notify: Salvar configuração

- name: Configurar interfaces - "{{ item.name }}"
  vyos.vyos.vyos_interfaces:
    config:
      - name: "{{ item.name }}"
        description: "{{ item.description }}"
        enabled: "{{ item.enabled }}"
    state: replaced
  loop: "{{ interfaces }}"
  notify: Salvar configuração

- name: Configurar interfaces L3 IPv4 - "{{ item.name }}"
  vyos.vyos.vyos_l3_interfaces:
    config:
      - name: "{{ item.name }}"
        ipv4:
          - address: "{{ item.address }}"
    state: replaced
  loop: "{{ interfaces }}"
  notify: Salvar configuração

- name: Configurar NTP global
  vyos.vyos.vyos_ntp_global:
    config:
      servers:
        - server: "{{ item }}"
    state: merged
  loop: "{{ ntp_servers }}"
  notify: Salvar configuração

- name: Criar novo usuário
  vyos.vyos.vyos_user:
    name: "{{ item.name }}"
    configured_password: "{{ item.password }}"
    public_keys:
      - name: "{{ ssh_public[item.ssh_public_ref].name }}"
        key: "{{ ssh_public[item.ssh_public_ref].key }}"
        type: "{{ ssh_public[item.ssh_public_ref].type }}"
    update_password: on_create
    state: present
  loop: "{{ default_users }}"
  loop_control:
    loop_var: item
  notify: Salvar configuração



