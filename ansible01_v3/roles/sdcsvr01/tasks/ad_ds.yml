---

- name: Instalar Feature AD-Domain-Services e Ferramentas RSAT
  ansible.windows.win_feature:
    name: AD-Domain-Services
    include_sub_features: true
    include_management_tools: true
    state: present

- name: Criar Nova Floresta e Domínio (Promoção Automática)
  microsoft.ad.domain:
    dns_domain_name: "{{ ad_domain_name }}"
    domain_netbios_name: "{{ ad_netbios_name }}"
    safe_mode_password: "{{ ad_safe_mode_password }}"
    domain_mode: "{{ ad_domain_mode }}"
    forest_mode: "{{ ad_forest_mode }}"
    database_path: "{{ ad_db_path }}"
    log_path: "{{ ad_log_path }}"
    sysvol_path: "{{ ad_sysvol_path }}"
    install_dns: "{{ ad_install_dns | bool }}"
    create_dns_delegation: "{{ ad_create_dns_delegation | bool}}"
    reboot: true
    reboot_timeout: 900
  register: ad_promotion_result




