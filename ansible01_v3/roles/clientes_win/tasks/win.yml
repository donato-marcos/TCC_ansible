---

- name: Configurar nome do servidor
  ansible.windows.win_hostname:
    name: "{{ server_name }}"
  register: hostname_change

- name: Reiniciar se o nome for alterado
  ansible.windows.win_reboot:
    reboot_timeout: 600
  when: hostname_change.reboot_required

- name: Instalando pacotes
  ansible.builtin.import_tasks:
    file: win-softwares.yml

- name: Adicionar cliente Windows ao domínio
  ansible.builtin.import_tasks:
    file: win-add_member-ad.yml
