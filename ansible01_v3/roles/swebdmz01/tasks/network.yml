---

- name: Configurar interfaces no Rocky Linux 9
  community.general.nmcli:
    conn_name: "{{ item.name }}"
    ifname: "{{ item.name }}"
    type: "{{ item.type }}"
    ip4: "{{ item.ipv4 }}"
    gw4: "{{ item.gw4 }}"
    dns4: "{{ item.dns4 }}"
    autoconnect: "{{ item.autoconnect }}"
    state: present
  loop: "{{ interfaces }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reiniciar NetworkManager

- name: Forçar execução dos handlers agora
  ansible.builtin.meta: flush_handlers