#    state: directory
#    owner: nginx
#    group: nginx
#    mode: '0755'
#  loop: "{{ sites }}"
#  loop_control:
#    label: "Diretório: {{ item.web_dir }}"

- name: Copiar arquivos estáticos para os sites
  ansible.builtin.copy:
    src: "files/{{ item.name }}/"
    dest: "{{ item.web_dir }}/"
    owner: nginx
    group: nginx
    mode: '0755'
  loop: "{{ sites }}"
  loop_control:
    label: "Arquivos de: {{ item.name }}"

- name: Configurar NGINX para cada site
  ansible.builtin.template:
    src: "site.conf.j2"
    dest: "/etc/nginx/conf.d/{{ item.web_site }}.conf"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ sites }}"
  loop_control:
    label: "Configurando vhost: {{ item.web_site }}"
  notify:
    - Validar NGINX global  
    - Restart NGINX

- name: Iniciar e habilitar serviço NGINX
  ansible.builtin.systemd_service:
    name: nginx.service
    enabled: yes
    state: started
