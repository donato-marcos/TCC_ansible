---

- name: Reiniciar NetworkManager
  ansible.builtin.systemd_service:
    name: NetworkManager.service
    state: restarted

- name: Validar NGINX global
  ansible.builtin.command: nginx -t

- name: Restart NGINX
  ansible.builtin.systemd_service:
    name: nginx.service
    state: restarted

- name: Restaurar contextos SELinux
  ansible.builtin.command: restorecon -Rv "{{ item.web_dir }}"
  loop: "{{ sites }}"
  loop_control:
    label: "Restaurando contextos em {{ item.web_dir }}"
